<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#EA580C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Huevos Don Renato</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-color: #FFF8F0;
            --brand-amber: #EA580C;
            --text-dark: #431407;
        }
        body {
            background-color: #F3F4F6;
            color: var(--text-dark);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            margin: 0;
            padding: 0;
        }
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: var(--bg-color);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .safe-pb { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 90px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 0px); }
        
        /* Animación suave para modales */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Ocultar scrollbar pero permitir scroll */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex flex-col justify-center items-center h-screen bg-[#FFF8F0] text-[#EA580C]">
            <i class="fa-solid fa-egg fa-bounce fa-3x mb-4"></i>
            <h2 class="font-black text-xl">Cargando Don Renato...</h2>
        </div>
    </div>

    <!-- Firebase Script Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, updateDoc, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de demostración para que funcione out-of-the-box. 
        // Para producción, se reemplazaría con las credenciales de Firebase del cliente.
        window.dbUtils = {
            init: async () => {
                const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "demo-don-renato-app" };
                try {
                    const app = initializeApp(config);
                    const auth = getAuth(app);
                    const db = getFirestore(app);
                    await signInAnonymously(auth);
                    
                    window.fsDb = db;
                    window.fsBasePath = `data/don-renato`;
                    return true;
                } catch (error) {
                    console.error("Error Firebase:", error);
                    return false;
                }
            },
            onSnapshot, doc, collection, updateDoc, addDoc, query
        };
    </script>

    <!-- React App -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Catálogo Limpio: Sin URLs de imágenes, solo Emojis nativos rápidos.
        const PRODUCTS = [
            { id: 'bandeja_extra_color', name: 'Bandeja Extra Color', price: 7000, emoji: '🥚' },
            { id: 'bandeja_primera_color', name: 'Bandeja Primera Color', price: 6000, emoji: '🥚' },
            { id: 'bandeja_extra_blanco', name: 'Bandeja Extra Blanco', price: 7000, emoji: '🥚' },
            { id: 'caja_extra_color', name: 'Caja Extra de Color', price: 34000, emoji: '📦' },
            { id: 'caja_primera_color', name: 'Caja Primera Color', price: 32000, emoji: '📦' },
            { id: 'caja_extra_blanco', name: 'Caja Extra Blanco', price: 34000, emoji: '📦' },
            { id: 'queso_mantecoso', name: 'Queso Río Cruces', price: 11990, emoji: '🧀' },
        ];

        function getLocalYYYYMMDD(isoString = null) {
            const d = isoString ? new Date(isoString) : new Date();
            const tzOffset = d.getTimezoneOffset() * 60000;
            return (new Date(d - tzOffset)).toISOString().slice(0, 10);
        }

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [isReady, setIsReady] = useState(false);
            const [activeTab, setActiveTab] = useState('ruta'); // Tabs: dashboard, ruta, historial
            const [showNewOrder, setShowNewOrder] = useState(false);
            const [orders, setOrders] = useState([]);

            useEffect(() => {
                let unsubOrders = () => {};
                const setupDatabase = async () => {
                    while(!window.dbUtils) { await new Promise(r => setTimeout(r, 100)); }
                    const success = await window.dbUtils.init();
                    if (!success) { setIsReady(true); return; }

                    const { onSnapshot, collection, query } = window.dbUtils;
                    const ordersQuery = query(collection(window.fsDb, `${window.fsBasePath}/orders`));
                    unsubOrders = onSnapshot(ordersQuery, (snapshot) => {
                        const loadedOrders = [];
                        snapshot.forEach((doc) => loadedOrders.push({ id: doc.id, ...doc.data() }));
                        // Ordenar del más nuevo al más viejo
                        loadedOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                        setOrders(loadedOrders);
                    });
                    setIsReady(true);
                };
                setupDatabase();
                return () => unsubOrders();
            }, []);

            const handleCreateOrder = async (orderData) => {
                if(!window.fsDb) return;
                const { addDoc, collection } = window.dbUtils;
                try {
                    await addDoc(collection(window.fsDb, `${window.fsBasePath}/orders`), {
                        ...orderData,
                        status: 'pendiente',
                        createdAt: new Date().toISOString()
                    });
                    setShowNewOrder(false);
                } catch (e) { console.error("Error al guardar pedido:", e); }
            };

            const handleDeliverOrder = async (order) => {
                if(!window.fsDb) return;
                const { updateDoc, doc } = window.dbUtils;
                try {
                    await updateDoc(doc(window.fsDb, `${window.fsBasePath}/orders`, order.id), {
                        status: 'entregado',
                        deliveredAt: new Date().toISOString()
                    });
                } catch (e) { console.error("Error al entregar:", e); }
            };

            if (!isReady) return null;

            return (
                <div className="mobile-container">
                    {/* Header Marca */}
                    <header className="bg-gradient-to-r from-orange-600 to-amber-600 text-white p-4 safe-pt sticky top-0 z-10 shadow-md">
                        <div className="flex items-center gap-3">
                            <div className="bg-white text-orange-600 w-11 h-11 rounded-full flex items-center justify-center text-2xl shadow-inner">
                                🐓
                            </div>
                            <div className="flex-1">
                                <h1 className="text-xl font-black uppercase tracking-tight leading-none">Don Renato</h1>
                                <p className="text-orange-100 text-[10px] font-bold uppercase tracking-widest mt-1">
                                    Calidad que se nota
                                </p>
                            </div>
                            <div className="bg-orange-800/40 px-2 py-1 rounded-md text-[11px] font-bold border border-orange-400/30">
                                <i className="fa-solid fa-location-dot mr-1 text-orange-200"></i> L.A.
                            </div>
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="flex-1 overflow-y-auto safe-pb bg-gray-50/50">
                        {activeTab === 'dashboard' && <DashboardView orders={orders} />}
                        {activeTab === 'ruta' && <RouteView orders={orders} onDeliver={handleDeliverOrder} onOpenNew={() => setShowNewOrder(true)} />}
                        {activeTab === 'historial' && <HistoryView orders={orders} />}
                    </main>

                    {/* Modal Nuevo Pedido */}
                    {showNewOrder && <NewOrderModal onClose={() => setShowNewOrder(false)} onSave={handleCreateOrder} />}

                    {/* Barra de Navegación Inferior (3 Pestañas Simplificadas) */}
                    <nav className="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-200 flex justify-between items-center pb-[env(safe-area-inset-bottom)] z-40 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                        {[
                            { id: 'dashboard', icon: 'fa-chart-pie', label: 'Hoy' },
                            { id: 'ruta', icon: 'fa-truck-fast', label: 'Ruta' },
                            { id: 'historial', icon: 'fa-calendar-days', label: 'Historial' }
                        ].map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex-1 py-4 flex flex-col items-center gap-1 transition-colors ${activeTab === tab.id ? 'text-orange-600' : 'text-gray-400 hover:text-gray-500'}`}
                            >
                                <i className={`fa-solid ${tab.icon} text-2xl ${activeTab === tab.id ? 'scale-110 mb-1' : 'mb-1'} transition-transform`}></i>
                                <span className="text-[11px] font-black uppercase tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        /* --- VISTA: RUTA Y PEDIDOS --- */
        function RouteView({ orders, onDeliver, onOpenNew }) {
            const pendingOrders = orders.filter(o => o.status === 'pendiente');

            const handleWhatsApp = (phone, name) => {
                const clean = phone.replace(/\D/g, '');
                if(!clean) {
                    alert("El cliente no tiene un número registrado.");
                    return;
                }
                const msg = encodeURIComponent(`Hola ${name}, somos Huevos Don Renato 🐓🥚. ¡Vamos en camino a su domicilio con su pedido!`);
                window.open(`https://wa.me/${clean}?text=${msg}`, '_blank');
            };

            const handleMaps = (address) => {
                const query = encodeURIComponent(`${address}, Los Ángeles, Biobío, Chile`);
                window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
            };

            return (
                <div className="p-4 space-y-4">
                    <div className="flex justify-between items-end mb-2">
                        <h2 className="text-2xl font-black text-[#431407]">Ruta Actual</h2>
                        <span className="bg-orange-100 text-orange-800 px-3 py-1.5 rounded-full font-black text-sm border border-orange-200">
                            {pendingOrders.length} Pendientes
                        </span>
                    </div>

                    {pendingOrders.length === 0 ? (
                        <div className="text-center py-16 px-4 bg-white rounded-3xl border border-dashed border-gray-300 shadow-sm">
                            <div className="bg-green-50 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-5 border border-green-100">
                                <i className="fa-solid fa-check-double text-5xl text-green-500"></i>
                            </div>
                            <h3 className="text-2xl font-black text-gray-800">¡Ruta limpia!</h3>
                            <p className="text-gray-500 mt-2 font-medium">No hay pedidos pendientes por entregar. Toca el botón + para agregar uno nuevo.</p>
                        </div>
                    ) : (
                        <div className="space-y-4 pb-10">
                            {pendingOrders.map(order => (
                                <div key={order.id} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
                                    {/* Indicador de color izquierdo */}
                                    <div className="absolute top-0 left-0 w-1.5 h-full bg-orange-500"></div>
                                    
                                    <div className="flex justify-between items-start">
                                        <div className="pr-2">
                                            <h3 className="font-black text-lg text-gray-900 leading-tight">{order.customerName}</h3>
                                            <p className="text-sm text-gray-600 mt-1.5 flex items-start gap-1.5">
                                                <i className="fa-solid fa-location-dot mt-0.5 text-orange-500"></i>
                                                <span className="font-bold">{order.address}</span>
                                            </p>
                                        </div>
                                        <div className="bg-orange-50 px-3 py-1.5 rounded-xl border border-orange-100 flex-shrink-0">
                                            <span className="font-black text-lg text-orange-600">${order.total.toLocaleString('es-CL')}</span>
                                        </div>
                                    </div>

                                    {/* Detalles del pedido */}
                                    <div className="mt-4 pt-4 border-t border-gray-100 space-y-2.5">
                                        {order.items.map((item, idx) => {
                                            const p = PRODUCTS.find(prod => prod.id === item.id);
                                            return (
                                                <div key={idx} className="flex items-center gap-2 text-sm font-bold text-gray-700">
                                                    <span className="bg-gray-100 text-gray-600 px-2 py-1 rounded-md text-xs w-8 text-center">{item.qty}x</span>
                                                    <span className="text-lg w-6 text-center">{p ? p.emoji : '📦'}</span>
                                                    <span>{p ? p.name : item.id}</span>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Botones de Acción Integrados (Mapas, WhatsApp, Entregado) */}
                                    <div className="flex gap-2 mt-5 pt-2">
                                        <button 
                                            onClick={() => handleMaps(order.address)}
                                            className="w-14 h-14 bg-blue-50 text-blue-600 border border-blue-100 rounded-xl flex items-center justify-center text-2xl shadow-sm active:bg-blue-100 transition-colors flex-shrink-0"
                                            aria-label="Ver en mapa"
                                        >
                                            <i className="fa-solid fa-map-location-dot"></i>
                                        </button>
                                        <button 
                                            onClick={() => handleWhatsApp(order.phone, order.customerName)}
                                            className="w-14 h-14 bg-green-50 text-green-600 border border-green-100 rounded-xl flex items-center justify-center text-3xl shadow-sm active:bg-green-100 transition-colors flex-shrink-0"
                                            aria-label="Avisar por WhatsApp"
                                        >
                                            <i className="fa-brands fa-whatsapp"></i>
                                        </button>
                                        <button 
                                            onClick={() => onDeliver(order)}
                                            className="flex-1 bg-green-600 text-white rounded-xl font-black shadow-md flex items-center justify-center gap-2 active:bg-green-700 transition-colors text-lg"
                                        >
                                            <i className="fa-solid fa-check"></i>
                                            Entregado
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Botón Flotante para Nuevo Pedido */}
                    <button 
                        onClick={onOpenNew}
                        className="fixed bottom-28 right-5 w-16 h-16 bg-orange-600 text-white rounded-full shadow-[0_4px_20px_rgba(234,88,12,0.6)] flex items-center justify-center text-3xl active:scale-90 transition-transform z-30"
                    >
                        <i className="fa-solid fa-plus"></i>
                    </button>
                </div>
            );
        }

        /* --- VISTA: DASHBOARD (HOY) --- */
        function DashboardView({ orders }) {
            const stats = useMemo(() => {
                const todayLocal = getLocalYYYYMMDD();
                const todaysOrders = orders.filter(o => 
                    getLocalYYYYMMDD(o.createdAt) === todayLocal || 
                    (o.deliveredAt && getLocalYYYYMMDD(o.deliveredAt) === todayLocal)
                );
                
                const delivered = todaysOrders.filter(o => o.status === 'entregado');
                const pending = todaysOrders.filter(o => o.status === 'pendiente');
                const income = delivered.reduce((sum, o) => sum + o.total, 0);

                return { pending: pending.length, completed: delivered.length, income };
            }, [orders]);

            return (
                <div className="p-4 space-y-4">
                    <h2 className="text-2xl font-black text-[#431407]">Resumen de Hoy</h2>
                    
                    <div className="bg-gradient-to-br from-orange-500 to-amber-600 rounded-3xl p-6 text-white shadow-lg relative overflow-hidden">
                        <i className="fa-solid fa-hand-holding-dollar absolute -right-4 -bottom-4 text-8xl opacity-10"></i>
                        <p className="font-bold text-orange-100 uppercase tracking-wider text-xs">Ingresos del Día</p>
                        <p className="text-5xl font-black mt-2">${stats.income.toLocaleString('es-CL')}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center justify-center text-center">
                            <span className="text-gray-400 font-bold uppercase text-xs tracking-wider">Por Entregar</span>
                            <span className="text-5xl font-black text-orange-500 mt-2">{stats.pending}</span>
                        </div>
                        <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center justify-center text-center">
                            <span className="text-gray-400 font-bold uppercase text-xs tracking-wider">Entregados</span>
                            <span className="text-5xl font-black text-green-500 mt-2">{stats.completed}</span>
                        </div>
                    </div>
                </div>
            );
        }

        /* --- VISTA: HISTORIAL (POR FECHAS) --- */
        function HistoryView({ orders }) {
            const [selectedDate, setSelectedDate] = useState(getLocalYYYYMMDD());

            const stats = useMemo(() => {
                const deliveredOnDate = orders.filter(o => 
                    o.status === 'entregado' && 
                    o.deliveredAt && 
                    getLocalYYYYMMDD(o.deliveredAt) === selectedDate
                );

                const income = deliveredOnDate.reduce((sum, o) => sum + o.total, 0);
                
                const productsCount = {};
                deliveredOnDate.forEach(o => {
                    o.items.forEach(item => {
                        productsCount[item.id] = (productsCount[item.id] || 0) + item.qty;
                    });
                });

                return { deliveredOnDate, income, productsCount };
            }, [orders, selectedDate]);

            const displayDate = new Date(selectedDate + "T12:00:00").toLocaleDateString('es-CL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            return (
                <div className="p-4 space-y-5">
                    <h2 className="text-2xl font-black text-[#431407]">Reportes de Ventas</h2>

                    {/* Selector de Fecha */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Seleccionar Fecha</label>
                        <input 
                            type="date" 
                            value={selectedDate}
                            onChange={(e) => setSelectedDate(e.target.value)}
                            className="w-full p-3 rounded-xl border border-gray-200 font-bold text-gray-800 bg-gray-50 focus:border-orange-500 outline-none block"
                        />
                    </div>

                    {/* Tarjeta de Resumen */}
                    <div className="bg-[#431407] rounded-3xl p-6 text-white shadow-lg relative overflow-hidden">
                        <i className="fa-solid fa-sack-dollar absolute -right-2 -bottom-2 text-7xl opacity-10 text-white"></i>
                        <p className="font-bold text-orange-200 uppercase tracking-wider text-xs capitalize">{displayDate}</p>
                        <p className="text-4xl font-black mt-2">${stats.income.toLocaleString('es-CL')}</p>
                        <p className="text-sm font-bold mt-2 text-gray-300">
                            <i className="fa-solid fa-check-circle mr-1 text-green-400"></i>
                            {stats.deliveredOnDate.length} pedidos completados
                        </p>
                    </div>

                    {/* Lista de Productos Vendidos */}
                    {Object.keys(stats.productsCount).length > 0 ? (
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                            <h3 className="font-black text-gray-800 mb-4 uppercase text-sm tracking-wide">
                                <i className="fa-solid fa-basket-shopping mr-2 text-orange-500"></i>
                                Productos Vendidos
                            </h3>
                            <div className="space-y-3">
                                {PRODUCTS.map(p => {
                                    const qty = stats.productsCount[p.id];
                                    if (!qty) return null;
                                    return (
                                        <div key={p.id} className="flex items-center justify-between border-b border-gray-50 pb-3 last:border-0 last:pb-0">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 bg-orange-50 text-orange-500 rounded-xl flex items-center justify-center text-xl">
                                                    {p.emoji}
                                                </div>
                                                <p className="font-bold text-gray-800 text-sm">{p.name}</p>
                                            </div>
                                            <span className="font-black text-orange-600 bg-orange-50 px-3 py-1 rounded-lg">
                                                {qty} {p.id.includes('caja') ? 'cajas' : 'unid.'}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-8 text-gray-400 font-bold">
                            No hay ventas registradas en esta fecha.
                        </div>
                    )}
                </div>
            );
        }

        /* --- MODAL: NUEVO PEDIDO --- */
        function NewOrderModal({ onClose, onSave }) {
            const [customer, setCustomer] = useState('');
            const [address, setAddress] = useState('');
            const [phone, setPhone] = useState('');
            const [items, setItems] = useState({});

            const updateQty = (id, delta) => {
                setItems(prev => {
                    const current = prev[id] || 0;
                    const next = Math.max(0, current + delta);
                    if (next === 0) {
                        const copy = {...prev};
                        delete copy[id];
                        return copy;
                    }
                    return {...prev, [id]: next};
                });
            };

            const total = Object.entries(items).reduce((sum, [id, qty]) => {
                const p = PRODUCTS.find(x => x.id === id);
                return sum + (p ? p.price * qty : 0);
            }, 0);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!customer || !address || Object.keys(items).length === 0) {
                    alert("Falta ingresar cliente, dirección o productos.");
                    return;
                }
                const orderItems = Object.entries(items).map(([id, qty]) => ({id, qty}));
                onSave({ customerName: customer, address, phone, items: orderItems, total });
            };

            return (
                <div className="fixed inset-0 z-50 flex flex-col justify-end bg-black/60 backdrop-blur-sm">
                    <div className="bg-[#FFF8F0] w-full max-w-[480px] mx-auto h-[92vh] rounded-t-3xl flex flex-col animate-slide-up shadow-2xl">
                        {/* Cabecera del Modal */}
                        <div className="flex justify-between items-center p-5 bg-white rounded-t-3xl border-b border-gray-100">
                            <h3 className="text-xl font-black text-[#431407]">Ingresar Pedido</h3>
                            <button onClick={onClose} className="w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 font-bold active:bg-gray-200">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Formulario Scrolleable */}
                        <div className="flex-1 overflow-y-auto p-4 pb-10">
                            <form id="orderForm" onSubmit={handleSubmit} className="space-y-5">
                                {/* Datos del Cliente */}
                                <div className="space-y-3 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                    <h4 className="font-black text-gray-800 text-xs uppercase tracking-wide">Datos de Entrega</h4>
                                    
                                    <input required placeholder="Nombre o Local" value={customer} onChange={e=>setCustomer(e.target.value)}
                                        className="w-full p-4 rounded-xl border border-gray-200 font-bold text-gray-800 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 outline-none transition-all bg-gray-50" />
                                    
                                    <input required placeholder="Dirección Exacta" value={address} onChange={e=>setAddress(e.target.value)}
                                        className="w-full p-4 rounded-xl border border-gray-200 font-bold text-gray-800 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 outline-none transition-all bg-gray-50" />
                                    
                                    <div className="relative">
                                        <span className="absolute left-4 top-4 text-gray-400 font-black">+56 9</span>
                                        <input type="tel" placeholder="1234 5678" value={phone} onChange={e=>setPhone(e.target.value)}
                                            className="w-full p-4 pl-16 rounded-xl border border-gray-200 font-bold text-gray-800 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 outline-none transition-all bg-gray-50" />
                                    </div>
                                </div>

                                {/* Selección de Productos - SIN IMÁGENES */}
                                <div>
                                    <h4 className="font-black text-gray-800 mb-3 text-xs uppercase tracking-wide ml-1">Productos</h4>
                                    <div className="space-y-2.5">
                                        {PRODUCTS.map(p => (
                                            <div key={p.id} className={`bg-white p-3 rounded-2xl shadow-sm border ${items[p.id] ? 'border-orange-400 bg-orange-50/50' : 'border-gray-100'} flex items-center justify-between transition-colors`}>
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-2xl flex-shrink-0 ${items[p.id] ? 'bg-orange-100 text-orange-600' : 'bg-gray-50 text-gray-400'}`}>
                                                        {p.emoji}
                                                    </div>
                                                    <div>
                                                        <p className="font-bold text-sm text-gray-900 leading-tight">{p.name}</p>
                                                        <p className="font-black text-orange-600 text-sm mt-0.5">${p.price.toLocaleString('es-CL')}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2 pr-1">
                                                    {items[p.id] ? (
                                                        <button type="button" onClick={()=>updateQty(p.id, -1)} className="w-10 h-10 bg-white border border-gray-200 shadow-sm rounded-full font-black text-gray-700 active:scale-90 text-lg">-</button>
                                                    ) : <div className="w-10 h-10"></div>}
                                                    
                                                    <span className="font-black text-lg w-6 text-center">{items[p.id] || 0}</span>
                                                    
                                                    <button type="button" onClick={()=>updateQty(p.id, 1)} className="w-10 h-10 bg-orange-100 text-orange-600 shadow-sm rounded-full font-black active:scale-90 text-lg">+</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </form>
                        </div>

                        {/* Pie del Modal con Botón Confirmar */}
                        <div className="bg-white p-4 border-t border-gray-100 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] pb-[env(safe-area-inset-bottom)]">
                            <div className="flex justify-between items-center mb-3 px-2">
                                <span className="font-bold text-gray-500 uppercase text-xs tracking-wider">Total a Cobrar</span>
                                <span className="font-black text-3xl text-[#431407]">${total.toLocaleString('es-CL')}</span>
                            </div>
                            <button type="submit" form="orderForm" className="w-full bg-orange-600 text-white font-black text-lg py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 active:bg-orange-700 transition-colors">
                                <i className="fa-solid fa-check"></i> Confirmar Pedido
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
